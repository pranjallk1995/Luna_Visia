services:
  mcp:
    build: ./mcp
    working_dir: /workspace/mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lunavisia:${POSTGRES_PASSWORD:-lunavisia-dev}@luna-sentia-db:5432/lunavisia
      IMAGE_DIR: /data/images
      OLLAMA_URL: ${OLLAMA_URL:-http://luna-sentia-ollama:11434}
      VISION_MODEL: ${VISION_MODEL:-qwen2.5vl:7b}
      LUNAVISIA_PUBLIC_BASE_URL: ${LUNAVISIA_PUBLIC_BASE_URL}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-http://localhost:18000}
      LUNAVISIA_API_TOKEN: ${LUNAVISIA_API_TOKEN:?Set LUNAVISIA_API_TOKEN to a private random value of at least 32 characters}
    expose:
      - "8000"
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - image_data:/data/images
      - download_data:/data/downloads
    develop:
      watch:
        - action: sync+restart
          path: ./mcp
          target: /workspace/mcp
          ignore:
            - __pycache__/
            - "*.py[cod]"
            - .pytest_cache/
            - tests/
            - requirements.txt
            - Dockerfile
        - action: rebuild
          path: ./mcp/requirements.txt
        - action: rebuild
          path: ./mcp/Dockerfile
    networks:
      sentia_network:
        aliases:
          - luna-visia-mcp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ui:
    build: ./ui
    working_dir: /workspace/ui
    restart: unless-stopped
    environment:
      LUNA_SSO_URL: ${LUNA_SSO_URL:?Set LUNA_SSO_URL to Luna Sentia's public sign-on address}
      LUNA_SSO_INTERNAL_URL: ${LUNA_SSO_INTERNAL_URL:-http://luna-sentia-auth:8000}
      IMAGE_DIR: /data/images
      MCP_URL: http://luna-visia-mcp:8000/mcp
      LUNAVISIA_API_URL: http://luna-visia-mcp:8000
      LUNAVISIA_API_TOKEN: ${LUNAVISIA_API_TOKEN:?Set LUNAVISIA_API_TOKEN to a private random value of at least 32 characters}
      LUNAVISIA_ALLOWED_EMAILS: ${LUNAVISIA_ALLOWED_EMAILS:?Set LUNAVISIA_ALLOWED_EMAILS to the Google accounts allowed to access Visia}
    ports:
      - "127.0.0.1:18501:8501"
    volumes:
      - image_data:/data/images:ro
    develop:
      watch:
        - action: sync
          path: ./ui
          target: /workspace/ui
          ignore:
            - __pycache__/
            - "*.py[cod]"
            - .pytest_cache/
            - requirements.txt
            - Dockerfile
        - action: rebuild
          path: ./ui/requirements.txt
        - action: rebuild
          path: ./ui/Dockerfile
    networks:
      sentia_network:
        aliases:
          - luna-visia-ui
    depends_on:
      mcp:
        condition: service_healthy

volumes:
  image_data:
    name: luna_visia_image_data
  download_data:
    name: luna_visia_download_data

networks:
  sentia_network:
    external: true
    name: luna_sentia_network
